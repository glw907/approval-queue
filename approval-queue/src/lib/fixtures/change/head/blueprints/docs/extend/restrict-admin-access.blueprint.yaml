        text: |
          In the adapter module, declare the vocabulary with `defineRoles` and export it as
          `roles`, mapping `owner` to `'owner'` and both `editor` and webmaster to `'editor'`.
        requires:
          - scaffolded-site
        produces:
          - roles-declared
        canFail: true
      - id: x-roles-throw
        kind: failure
        from: s-roles-declare
        symptom: |
          The server start throws from `defineRoles`.
        cause: |
          The vocabulary has no `owner` key mapped to owner capability.
        handledBy: s-roles-declare
      - id: s-roles-member
        kind: step
        text: |
          In the same file, add `roles` to the `defineAdapter` call.
        requires:
          - roles-declared
        produces:
          - roles-on-adapter
      - id: roles-handoff
        kind: handoff
        text: |
          The map names these roles.
  - id: declare-the-access-map
    heading: Declare the access map
    why: |
      - id: s-map-vocab
        kind: step
        text: |
          If the adapter already declares `access`, in its `defineAccess` call, pass `roles` as
          the first argument in place of `undefined`, as the example site's call needs. A site
          with no `access` member skips this step and takes the next.
        requires:
          - roles-on-adapter
        produces:
          - map-vocab-passed
        optional: true
      - id: s-map-member
        kind: step
        text: |
          If the adapter has no `access` member, in the `defineAdapter` call, add `access` set to
          a `defineAccess` call that passes `roles` first. A site that already declares `access`
          skips this step.
        requires:
          - roles-on-adapter
        produces:
          - map-vocab-passed
        optional: true
      - id: s-map
        kind: step
        text: |
          In the adapter module's `access` map, add a `media` key admitting webmaster and a key
          for your route's path listing the roles that reach it. In the example, the
          `/admin/signups` key admits webmaster in place of its owner-only rule. Keep every other
          key.
        requires:
          - roles-on-adapter
          - unchecked-route
        kind: fact
        fact: f:grxpu5
        use: |
          Only the `undefined` vocabulary rule, in the same paragraph: a map naming webmaster needs
          the declared vocabulary.
      - id: map-reference-link
        kind: link
        target: ../reference/core.md#defineaccess
      - id: x-map-throw
        kind: failure
        from: s-map
        symptom: |
          The server start throws a `defineAccess:` or `access:` error naming a key or a role.
        cause: |
          The map breaks one of the construction or composition checks.
        handledBy: s-map
      - id: map-unset-pointer
        kind: link
        target: '#decide-what-the-map-leaves-open'
      - id: map-handoff
        kind: handoff
        text: |
          The engine now enforces the map on its own screens, and your own routes enforce it
          through two calls.
  - id: enforce-the-map-on-your-routes
    heading: Enforce the map on your routes
    why: |
      `requireAccess` and `createSectionAction` read the map the guard attaches, so the route's
      checks follow the map that holds its key; with the key declared first, the route's
      `requireAccess` call never refuses everyone. The steps edit the reader's own route, and the
      example site's signups screen shows the form they produce.
          The remove is refused because `remove` carries `ownerOnly: true`, while the map admits
          webmaster to the screen.
        facts:
          - f:smbsa6
          - f:onqm6k
      - id: ver-handoff
        kind: handoff
        text: |
          A result that differs from these checks traces through the failure path that follows.
  - id: resolve-a-refusal
    heading: Resolve a refusal
    why: |
      The page's failure path: it traces a result that differs from [[verify-each-role-s-reach]] to
      its cause, so it follows the checks.
    opens: |
      An unexpected refusal traces to a missing key or `target`, a key that does not list the
      role, a role the vocabulary does not hold, or an auth database without the roles migration; an open screen the map should close
      traces to a deploy that predates the map or a route that skips `requireAccess`; and a remove
      that succeeds traces to a missing `ownerOnly`.
    items:
      - id: res-lead
        kind: sentence
        mode: verbatim
        text: |
          To find the cause, run these checks in order:
      - id: x-refuse-all
        kind: failure
        from: v-reload
        symptom: |
          A route refuses every session, owner included, and the `auth.access.refused` record's
          `reason` reads `no_rule`.
        cause: |
        handledBy: s-map
        facts:
          - f:8anql1
          - f:zo034s
      - id: x-shadowed
        kind: failure
        from: v-reload
        symptom: |
          A parameterized route refuses every session, and the `auth.access.refused` record's
          `reason` reads `shadowed`.
        cause: |
          A deeper map key hides the route's rule, and the route declares no `target`.
        handledBy: s-nest-load-target
        facts:
          - f:8anql1
      - id: x-role-not-listed
        kind: failure
        from: v-reload
        symptom: |
          The webmaster session is refused on your route or on the media library, and the
          `auth.access.refused` record names the webmaster role; a route's record reads
          `reason` `role`.
        cause: |
          The map holds a key for the target, but the key does not list webmaster, as the example
          site's starting owner-only `/admin/signups` key does.
        handledBy: s-map
        facts:
          - f:8anql1
          - f:joo5f2
          - f:0qb73i
          - f:3z1uxv
      - id: res-refuse-all
        kind: fact
        fact: f:8anql1
        use: |
          Only the record's target and its `no_rule`, `shadowed`, and `role` reasons, backing the
          three checks before.
      - id: res-nested-link
        kind: link
        target: '#key-nested-and-parameterized-routes'
      - id: x-role-unknown
        kind: failure
        from: v-reload
        symptom: |
          A webmaster editor is refused on every screen, and the logs show `auth.role.unknown`
          for that role.
        cause: |
          The role is absent from the adapter's vocabulary, so it resolves to `none`.
        handledBy: s-roles-declare
        facts:
          - f:zjglk8
          - f:4bazhe
